name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runbook-task-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: The task cycle runbook is consistent
        run: python flow.py --check
        working-directory: skills/runbook-task-cycle
